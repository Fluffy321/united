              - heading "Air Quality Alert issued May 18 at 11:35PM EDT by NWS Upton NY" [level=3] [ref=e388]
              - paragraph [ref=e389]: "The New York State Department of Environmental Conservation has issued an Air Quality Health Advisory for the following counties: New York, Bronx, Kings, Queens, Richmond, Nassau, Suffolk, Westchester, Rockland. from 11 AM to 11 PM EDT Tuesday. Air quality levels in outdoor air are predicted to be greater than an Air Quality Index value of 100 for the pollutant of Ground Level Ozone. The Air Quality Index, or AQI, was created as an easy way to correlate levels of different pollutants to one scale. The higher the AQI value, the greater the health concern. When pollution levels are elevated, the New York State Department of Health recommends that individuals consider limiting strenuous outdoor physical activity to reduce the risk of adverse health effects. People who may be especially sensitive to the effects of elevated levels of pollutants include the very young, and those with preexisting respiratory problems such as asthma or heart disease. Those with symptoms should consider consulting their personal physician. For additional information, please visit the New York State Department of Environmental Conservation website at, https://on.ny.gov/nyaqi, or call the Air Quality Hotline Source: National Weather Service - Nassau County Alerts Read source: https://api.weather.gov/alerts/urn:oid:2.49.0.1.840.0.159954f98545eee0f508164dbfb25310aa9476ef.003.1"
